# GitHub 飙升雷达 · Docker Compose
# 一键启动：./up.sh [环境名]   环境名 = .env.<名字>，不传默认 local
#   local = 本地开发环境（端口 9952，不提交 GitHub）
#   dev   = 发布/演示环境（端口 9951）
# 端口、数据库口令、GitHub Token、LLM 初始化等全部由 .env.<环境> 提供。
# DB 种子导入只发生在**数据卷为空**时（PostgreSQL 官方 entrypoint 语义 = 数据存在自动跳过）。

services:
  # 数据库 - PostgreSQL 15
  db:
    image: postgres:15
    container_name: ghradar-db-${GH_ENV_NAME}
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=100
      -c random_page_cost=1.1
      -c log_min_duration_statement=1000
    environment:
      POSTGRES_USER: ${GH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${GH_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${GH_DB_NAME:-github}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      # 持久化数据卷（删卷 = 删库，务必先备份）——按环境隔离:
      #   local → 项目 githubstar9952 (目录默认名) + 本卷 = 现有卷
      #           githubstar9952_ghradar_pgdata_9952, 数据在, 不触发种子导入
      #   dev   → 项目 githubstar-dev + 新建空卷 githubstar-dev_ghradar_pgdata_9951,
      #           首次启动由 initdb 导入种子 (卷非空自动跳过)
      - ghradar_pgdata_${GH_ENV_NAME}:/var/lib/postgresql/data
      # SQL 资料包（只读）
      - ./docs/sql:/seed:ro
      # 首次初始化脚本：容器**只在数据卷为空时**执行一次
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${GH_DB_PORT_HOST:-54321}:5432"
    # 健康检查：等待 initdb 完成 (检查哨兵文件)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GH_DB_USER:-postgres} -d ${GH_DB_NAME:-github} -q && test -f /var/lib/postgresql/data/.init_done"]
      interval: 5s
      timeout: 5s
      retries: 240
      start_period: 10s
    restart: unless-stopped

  # API 服务 - FastAPI
  api:
    image: ghradar-api:${GH_ENV_NAME}
    build:
      context: ./server
      args:
        # 国内加速 (可选)
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
        PIP_INDEX: ${PIP_INDEX:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: ghradar-api-${GH_ENV_NAME}
    environment:
      # 服务基本配置
      GH_HOST: 0.0.0.0
      GH_PORT: ${GH_PORT:-9951}
      GH_DEBUG: ${GH_DEBUG:-true}

      # 数据库连接
      GH_DB_HOST: db
      GH_DB_PORT: 5432
      GH_DB_NAME: ${GH_DB_NAME:-github}
      GH_DB_USER: ${GH_DB_USER:-postgres}
      GH_DB_PASSWORD: ${GH_DB_PASSWORD:-postgres}
      GH_DB_POOL_MIN: 2
      GH_DB_POOL_MAX: 16

      # GitHub Token (从 .env.<环境> 加载)
      GH_GITHUB_TOKEN: ${GH_GITHUB_TOKEN:-}
      GH_PROXY: ${GH_PROXY:-}

      # 采集与调度
      GH_CONCURRENCY: 6
      GH_SCHEDULER_ENABLED: ${GH_SCHEDULER_ENABLED:-true}

      # 管理员配置 (从 .env.<环境> 加载)
      GH_ADMIN_USER: ${GH_ADMIN_USER:-github}
      GH_ADMIN_PASSWORD: ${GH_ADMIN_PASSWORD:-github}
      GH_AUTH_SECRET: ${GH_AUTH_SECRET:-}
      GH_BOOTSTRAP: "true"
      SEED_DIR: /seed

      # LLM 模型初始化 (启动时: server/data/llm_config.json 已有供应商 → 跳过;
      # 为空且下面变量齐全 → 建默认供应商。见 llm_config.ensure_bootstrap_init)
      GH_LLM_BASE_URL: ${GH_LLM_BASE_URL:-}
      GH_LLM_API_KEY: ${GH_LLM_API_KEY:-}
      GH_LLM_API_PREFIX: ${GH_LLM_API_PREFIX:-/v1}
      GH_LLM_MODEL: ${GH_LLM_MODEL:-}
      GH_LLM_TIMEOUT_S: ${GH_LLM_TIMEOUT_S:-120}
      GH_LLM_MAX_RETRIES: ${GH_LLM_MAX_RETRIES:-2}

      # 环境
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: "1"

    # 网络配置
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # 用户权限 (NFS 挂载时使用)
    user: "${GH_UID:-1000}:${GH_GID:-1000}"

    # 停止宽限时间 (3 秒兜底)
    stop_grace_period: 3s

    volumes:
      # 种子/建表脚本(启动钩子要用)
      - ./docs/sql:/seed:ro
      # 前端资源挂载 (改动即生效)
      - ./server/web:/app/web:ro
      # 后端代码挂载
      - ./server/app:/app/app:ro
      - ./server/tools:/app/tools:ro
      # 配置持久化 (llm_config.json 在此；文件已存在则跳过模型初始化)
      - ./server/data:/app/data

    ports:
      - "${GH_PORT:-9951}:${GH_PORT:-9951}"

    # 依赖: 只等容器启动，不等健康检查
    depends_on:
      db:
        condition: service_started

    restart: unless-stopped

# 数据卷 —— 按环境隔离 (GH_ENV_NAME 由 up.sh/环境文件提供):
#   local (GH_ENV_NAME=9952): -p githubstar9952 下即现有卷
#           githubstar9952_ghradar_pgdata_9952 → 同名卷已存在则直接复用, 不清空不重导
#   dev   (GH_ENV_NAME=9951): 外部卷 = 原 9951 线上数据卷 githubstar_ghradar_pgdata
#           (合并承接发布环境的数据, 不重导种子; ⚠️ 旧 9951 栈必须先 down, 禁止双实例同卷)
volumes:
  ghradar_pgdata_9952:
  ghradar_pgdata_9951:
    external: true
    name: githubstar_ghradar_pgdata
